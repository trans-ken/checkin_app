<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);

  const els = {
    text: $('qr-text'),
    size: $('qr-size'),
    ec: $('qr-ec'),
    margin: $('qr-margin'),
    dark: $('qr-dark'),
    light: $('qr-light'),
    file: $('logo-file'),
    logoInfo: $('logo-info'),
    logoSize: $('logo-size'),
    logoSizeVal: $('logo-size-val'),
    logoBg: $('logo-bg'),
    logoShape: $('logo-shape'),
    ecWarning: $('ec-warning'),
    canvas: $('qr-canvas'),
    btnGen: $('btn-generate'),
    btnDl: $('btn-download'),
    btnSave: $('btn-save'),
    btnRefresh: $('btn-refresh'),
    status: $('status'),
    savedList: $('saved-list'),
    folderLink: $('folder-link'),
  };

  // 誤り訂正レベル別のロゴサイズ推奨上限 (%)
  const EC_MAX_LOGO = { L: 10, M: 15, Q: 20, H: 25 };
  // ロゴ画像ファイルサイズ上限 (2 MB) / 推奨最小解像度
  const LOGO_MAX_BYTES = 2 * 1024 * 1024;
  const LOGO_RECOMMENDED_MIN_PX = 256;

  let logoImage = null;     // HTMLImageElement
  let lastDataUrl = null;   // 最後に生成された PNG DataURL

  // ---------- イベント ----------
  els.btnGen.addEventListener('click', () => generate().catch(showError));
  els.btnDl.addEventListener('click', download);
  els.btnSave.addEventListener('click', saveToDrive);
  els.btnRefresh.addEventListener('click', loadSavedList);
  els.logoSize.addEventListener('input', () => {
    els.logoSizeVal.textContent = els.logoSize.value + '%';
    updateEcWarning();
  });
  els.ec.addEventListener('change', updateEcWarning);
  els.file.addEventListener('change', handleLogoFile);
  updateEcWarning();

  // ---------- ロゴ読み込み ----------
  function handleLogoFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) {
      logoImage = null;
      els.logoInfo.textContent = '指定しない場合はロゴなしの QR コードを生成します。';
      els.logoInfo.className = 'hint';
      return;
    }

    // ファイルサイズチェック
    if (file.size > LOGO_MAX_BYTES) {
      logoImage = null;
      const mb = (file.size / 1024 / 1024).toFixed(2);
      els.logoInfo.textContent =
        '⚠ ファイルサイズが大きすぎます (' + mb + ' MB / 上限 2 MB)。圧縮またはリサイズしてください。';
      els.logoInfo.className = 'hint warn';
      return;
    }

    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        logoImage = img;

        // 情報・警告メッセージ
        const w = img.naturalWidth, h = img.naturalHeight;
        const notes = [];
        notes.push(file.name + ' (' + w + '×' + h + ' px, ' +
          (file.size / 1024).toFixed(0) + ' KB)');
        const warnings = [];
        if (w < LOGO_RECOMMENDED_MIN_PX || h < LOGO_RECOMMENDED_MIN_PX) {
          warnings.push('解像度が低めです (推奨 ' + LOGO_RECOMMENDED_MIN_PX + ' px 以上)。拡大時にぼやける可能性があります。');
        }
        const ratio = Math.max(w, h) / Math.min(w, h);
        if (ratio > 1.3) {
          warnings.push('正方形でないため、中央にフィットさせて配置します (アスペクト比は保持)。');
        }
        if (warnings.length) {
          els.logoInfo.innerHTML = '✓ ' + escapeHtml(notes[0]) + '<br>⚠ ' + warnings.map(escapeHtml).join('<br>⚠ ');
          els.logoInfo.className = 'hint warn';
        } else {
          els.logoInfo.textContent = '✓ ' + notes[0];
          els.logoInfo.className = 'hint';
        }
        setStatus('ロゴ画像を読み込みました。「生成 / 更新」を押してください。', 'ok');
      };
      img.onerror = () => {
        logoImage = null;
        els.logoInfo.textContent = '⚠ 画像の読み込みに失敗しました。形式 (PNG/JPG/SVG/WebP) を確認してください。';
        els.logoInfo.className = 'hint warn';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- ロゴサイズと誤り訂正レベルの整合チェック ----------
  function updateEcWarning() {
    const ec = els.ec.value;
    const pct = parseInt(els.logoSize.value, 10);
    const max = EC_MAX_LOGO[ec];
    if (pct > max) {
      els.ecWarning.hidden = false;
      els.ecWarning.textContent =
        '⚠ 誤り訂正レベル ' + ec + ' に対してロゴサイズ ' + pct + '% は大きすぎます (推奨 ' + max + '% 以下)。' +
        '読み取れなくなる可能性があります。レベル H に上げるか、ロゴを縮小してください。';
    } else {
      els.ecWarning.hidden = true;
      els.ecWarning.textContent = '';
    }
  }

  // ---------- QR 生成 ----------
  async function generate() {
    if (typeof window.qrcode !== 'function') {
      throw new Error('QR ライブラリの読み込みに失敗しました。ネットワーク (CDN) が許可されているか確認してください。');
    }
    const text = (els.text.value || '').trim();
    if (!text) {
      throw new Error('QR コードに埋め込む URL またはテキストを入力してください。');
    }
    const size = clampInt(els.size.value, 128, 2048, 512);
    const margin = clampInt(els.margin.value, 0, 10, 2);
    const ec = els.ec.value;

    // qrcode-generator: typeNumber=0 で容量から自動決定
    const qr = window.qrcode(0, ec);
    qr.addData(text);
    qr.make();

    const moduleCount = qr.getModuleCount();
    const totalModules = moduleCount + margin * 2;
    // モジュール 1 つあたりのピクセル数 (整数化してモアレ回避)
    const cell = Math.max(1, Math.floor(size / totalModules));
    const drawnSize = cell * totalModules;

    const c = els.canvas;
    c.width = drawnSize;
    c.height = drawnSize;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // 背景
    ctx.fillStyle = els.light.value || '#ffffff';
    ctx.fillRect(0, 0, drawnSize, drawnSize);

    // モジュール (前景)
    ctx.fillStyle = els.dark.value || '#000000';
    for (let r = 0; r < moduleCount; r++) {
      for (let cIdx = 0; cIdx < moduleCount; cIdx++) {
        if (qr.isDark(r, cIdx)) {
          ctx.fillRect(
            (cIdx + margin) * cell,
            (r + margin) * cell,
            cell,
            cell
          );
        }
      }
    }

    // ロゴ
    if (logoImage) {
      drawLogo(ctx, drawnSize);
    }

    lastDataUrl = c.toDataURL('image/png');
    setStatus('QR コードを生成しました。', 'ok');
  }

  function drawLogo(ctx, size) {
    const pct = clampInt(els.logoSize.value, 5, 35, 22);
    const target = Math.round(size * pct / 100);

    // 元画像のアスペクト比を維持して target に収める
    const iw = logoImage.naturalWidth;
    const ih = logoImage.naturalHeight;
    const scale = Math.min(target / iw, target / ih);
    const dw = Math.round(iw * scale);
    const dh = Math.round(ih * scale);
    const dx = Math.round((size - dw) / 2);
    const dy = Math.round((size - dh) / 2);

    // 背景下地 (誤読防止)
    if (els.logoBg.value === 'white') {
      const pad = Math.round(Math.max(dw, dh) * 0.12);
      const bx = dx - pad;
      const by = dy - pad;
      const bw = dw + pad * 2;
      const bh = dh + pad * 2;
      ctx.save();
      ctx.fillStyle = els.light.value || '#ffffff';
      const shape = els.logoShape.value;
      if (shape === 'circle') {
        const r = Math.max(bw, bh) / 2;
        ctx.beginPath();
        ctx.arc(bx + bw / 2, by + bh / 2, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (shape === 'rounded') {
        roundedRect(ctx, bx, by, bw, bh, Math.round(pad * 1.2));
        ctx.fill();
      } else {
        ctx.fillRect(bx, by, bw, bh);
      }
      ctx.restore();
    }

    // ロゴ本体 (形状に応じてクリップ)
    ctx.save();
    if (els.logoShape.value === 'circle') {
      ctx.beginPath();
      ctx.arc(dx + dw / 2, dy + dh / 2, Math.min(dw, dh) / 2, 0, Math.PI * 2);
      ctx.clip();
    } else if (els.logoShape.value === 'rounded') {
      roundedRect(ctx, dx, dy, dw, dh, Math.round(Math.min(dw, dh) * 0.15));
      ctx.clip();
    }
    ctx.drawImage(logoImage, dx, dy, dw, dh);
    ctx.restore();
  }

  function roundedRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  // ---------- ダウンロード / 保存 ----------
  function download() {
    if (!lastDataUrl) {
      setStatus('先に「生成 / 更新」を押してください。', 'err');
      return;
    }
    const a = document.createElement('a');
    a.href = lastDataUrl;
    a.download = suggestFilename() + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function saveToDrive() {
    if (!lastDataUrl) {
      setStatus('先に「生成 / 更新」を押してください。', 'err');
      return;
    }
    setStatus('Google Drive に保存中…');
    els.btnSave.disabled = true;
    google.script.run
      .withSuccessHandler((res) => {
        els.btnSave.disabled = false;
        setStatus('保存しました: ' + res.name, 'ok');
        loadSavedList();
      })
      .withFailureHandler((err) => {
        els.btnSave.disabled = false;
        showError(err);
      })
      .saveQrToDrive(lastDataUrl, suggestFilename());
  }

  function suggestFilename() {
    const t = (els.text.value || '').trim();
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    if (!t) return 'qrcode_' + stamp;
    const head = t.replace(/^https?:\/\//, '').replace(/[\\/:*?"<>|\s]/g, '_').slice(0, 30);
    return 'qrcode_' + head + '_' + stamp;
  }

  // ---------- 一覧 ----------
  function loadSavedList() {
    google.script.run
      .withSuccessHandler(renderSavedList)
      .withFailureHandler(showError)
      .listSavedQrs();
  }

  function renderSavedList(res) {
    els.folderLink.innerHTML = '保存先フォルダ: <a href="' + res.folderUrl +
      '" target="_blank" rel="noopener">Drive で開く</a>';
    els.savedList.innerHTML = '';
    if (!res.files.length) {
      els.savedList.innerHTML = '<li style="grid-column: 1/-1; text-align:left; border:none; padding:0; color:var(--muted); font-size:13px;">まだ保存された QR コードはありません。</li>';
      return;
    }
    for (const f of res.files) {
      const li = document.createElement('li');
      li.innerHTML =
        '<a href="' + f.url + '" target="_blank" rel="noopener">' +
        '<img src="' + f.thumbnail + '" alt="' + escapeHtml(f.name) + '">' +
        '</a>' +
        '<div class="name">' + escapeHtml(f.name) + '</div>';
      els.savedList.appendChild(li);
    }
  }

  // ---------- ユーティリティ ----------
  function clampInt(v, min, max, fallback) {
    const n = parseInt(v, 10);
    if (Number.isNaN(n)) return fallback;
    return Math.max(min, Math.min(max, n));
  }

  function setStatus(msg, kind) {
    els.status.textContent = msg;
    els.status.className = 'status' + (kind ? ' ' + kind : '');
  }

  function showError(err) {
    const msg = (err && err.message) ? err.message : String(err);
    setStatus('エラー: ' + msg, 'err');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // 初期ロード
  loadSavedList();
})();
</script>
