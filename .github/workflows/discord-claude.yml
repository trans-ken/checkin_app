name: Discord → Claude Code

# Triggered from Discord (mobile) via a repository_dispatch event.
#
# ── Setup (one-time) ───────────────────────────────────────────────────────────
# 1. Create a Discord application + bot, invite it to your server.
# 2. Stand up a tiny webhook receiver (Cloudflare Worker / Vercel Function /
#    AWS Lambda — anything that can receive a Discord Interaction and forward it).
#    The receiver must POST to:
#      https://api.github.com/repos/<owner>/<repo>/dispatches
#    with header  Authorization: Bearer <GH_PAT with `repo` scope>
#    and body:
#      {
#        "event_type": "discord-claude",
#        "client_payload": {
#          "prompt":   "<message text from Discord>",
#          "user":     "<discord username>",
#          "channel":  "<discord channel id>"
#        }
#      }
# 3. Add repository secrets:
#      ANTHROPIC_API_KEY   — your Anthropic API key
#      DISCORD_WEBHOOK_URL — (optional) channel webhook for posting results back
# 4. From your phone in Discord:  `/claude <instruction>`
#    The receiver fires repository_dispatch, this workflow runs Claude on a
#    fresh branch, pushes the change, and opens a PR.

on:
  repository_dispatch:
    types: [discord-claude]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Create working branch
        id: branch
        run: |
          slug=$(echo "${{ github.event.client_payload.user }}" | tr -cd '[:alnum:]-' | cut -c1-20)
          branch="claude/discord-${slug:-mobile}-${{ github.run_id }}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The following instruction came from Discord user
            "${{ github.event.client_payload.user }}" on mobile:

            ---
            ${{ github.event.client_payload.prompt }}
            ---

            Implement the change on the current branch. Make focused edits,
            no scope creep. If the request is a question, write the answer to
            DISCORD_REPLY.md at the repo root instead of changing code.
          model: claude-opus-4-7

      - name: Commit & push
        id: commit
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "Discord request from ${{ github.event.client_payload.user }}

          ${{ github.event.client_payload.prompt }}"
          git push -u origin "${{ steps.branch.outputs.name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Discord: ${{ github.event.client_payload.prompt }}" \
            --body "Requested by **${{ github.event.client_payload.user }}** via Discord.

          > ${{ github.event.client_payload.prompt }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ "${{ steps.commit.outputs.changed }}" == "true" ]]; then
            msg="✅ PR opened: ${{ steps.pr.outputs.url }}"
          elif [[ "${{ job.status }}" == "success" ]]; then
            msg="ℹ️ No code changes were needed."
          else
            msg="❌ Run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"$msg\"}" \
            "$DISCORD_WEBHOOK_URL"
